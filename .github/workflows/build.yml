name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Optional: a Thunderstore service-account token. Without it the package is only attached
      # to the GitHub release.
      TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and full history are needed to decide whether this version is new and to
          # write the changelog.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Thunderstore CLI
        run: |
          dotnet tool install -g tcli
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # The game assemblies are not redistributable, so each build fetches the dedicated
      # server (free, anonymous login) and compiles against its Managed folder.
      - name: Download Valheim dedicated server
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q lib32gcc-s1 lib32stdc++6
          mkdir -p "$HOME/steamcmd" "$HOME/valheim-server"
          curl -sfL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar xz -C "$HOME/steamcmd"
          # SteamCMD sometimes fails its first attempt with "Missing configuration" before the
          # app info is cached, so try a few times.
          for attempt in 1 2 3 4; do
            "$HOME/steamcmd/steamcmd.sh" +@sSteamCmdForcePlatformType linux \
              +force_install_dir "$HOME/valheim-server" +login anonymous \
              +app_info_update 1 +app_update 896660 validate +quit && break
            echo "SteamCMD attempt $attempt failed, retrying"
            sleep 10
          done
          ls "$HOME/valheim-server/valheim_server_Data/Managed/assembly_valheim.dll"

      # The version in the csproj is the release version. A push to main with a version that
      # has no tag yet publishes a release; everything else only produces an artifact.
      - name: Resolve version
        id: version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/ValheimWebMap/ValheimWebMap.csproj)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version, release: $release"

      - name: Build
        run: ./build.sh -p:ValheimInstall="$HOME/valheim-server"

      - uses: actions/upload-artifact@v7
        with:
          name: ValheimWebMap-${{ steps.version.outputs.value }}
          path: |
            dist/ValheimWebMap/plugins/ValheimWebMap/ValheimWebMap.dll
            dist/ValheimWebMap-*.zip
            dist/thunderstore/*.zip
          if-no-files-found: error

      - name: Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          .github/changelog.sh "$VERSION" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > dist/notes.md
          cat dist/notes.md
          cp dist/thunderstore/*.zip dist/
          (cd dist && sha256sum ValheimWebMap-*.zip koenhendriks-ValheimWebMap-*.zip > SHA256SUMS)
          gh release create "v$VERSION" dist/ValheimWebMap-*.zip dist/koenhendriks-ValheimWebMap-*.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file dist/notes.md

      - name: Publish to Thunderstore
        if: steps.version.outputs.release == 'true' && env.TCLI_AUTH_TOKEN != ''
        run: tcli publish --file "dist/thunderstore/koenhendriks-ValheimWebMap-${{ steps.version.outputs.value }}.zip"
