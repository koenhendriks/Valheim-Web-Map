name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    # The Thunderstore token is an environment secret; the job must run in that environment to read it.
    environment: Default
    env:
      # Optional: a Thunderstore service-account token. Without it the package is only attached
      # to the GitHub release.
      TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags and full history are needed to decide whether this version is new and to
          # write the changelog.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install Thunderstore CLI
        run: |
          dotnet tool install -g tcli
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # The game assemblies are not redistributable, so each build fetches the dedicated
      # server (free, anonymous login) and compiles against its Managed folder.
      - name: Download Valheim dedicated server
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q lib32gcc-s1 lib32stdc++6
          mkdir -p "$HOME/steamcmd" "$HOME/valheim-server"
          curl -sfL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar xz -C "$HOME/steamcmd"
          # SteamCMD sometimes fails its first attempt with "Missing configuration" before the
          # app info is cached, so try a few times.
          for attempt in 1 2 3 4; do
            "$HOME/steamcmd/steamcmd.sh" +@sSteamCmdForcePlatformType linux \
              +force_install_dir "$HOME/valheim-server" +login anonymous \
              +app_info_update 1 +app_update 896660 validate +quit && break
            echo "SteamCMD attempt $attempt failed, retrying"
            sleep 10
          done
          ls "$HOME/valheim-server/valheim_server_Data/Managed/assembly_valheim.dll"

      # The version in the csproj is the release version. A push to main with a version that
      # has no tag yet publishes a release; everything else only produces an artifact.
      - name: Resolve version
        id: version
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/ValheimWebMap/ValheimWebMap.csproj)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version, release: $release"

      - name: Build
        run: ./build.sh -p:ValheimInstall="$HOME/valheim-server"

      - uses: actions/upload-artifact@v7
        with:
          name: ValheimWebMap-${{ steps.version.outputs.value }}
          path: |
            dist/ValheimWebMap/plugins/ValheimWebMap/ValheimWebMap.dll
            dist/ValheimWebMap-*.zip
            dist/thunderstore/*.zip
          if-no-files-found: error

      - name: Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          .github/changelog.sh "$VERSION" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > dist/notes.md
          cat dist/notes.md
          cp dist/thunderstore/*.zip dist/
          (cd dist && sha256sum ValheimWebMap-*.zip koenhendriks-ValheimWebMap-*.zip > SHA256SUMS)
          gh release create "v$VERSION" dist/ValheimWebMap-*.zip dist/koenhendriks-ValheimWebMap-*.zip dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file dist/notes.md

      # Publishes a version that is released on GitHub but not yet on Thunderstore. Checking the
      # listing instead of "did this run release" means a version whose first run could not
      # publish (no token yet, Thunderstore down) goes out on the next push.
      - name: Publish to Thunderstore
        id: publish
        if: github.ref == 'refs/heads/main' && env.TCLI_AUTH_TOKEN != ''
        env:
          VERSION: ${{ steps.version.outputs.value }}
          RELEASED_NOW: ${{ steps.version.outputs.release }}
        run: |
          if [ "$RELEASED_NOW" != "true" ] && ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is not released on GitHub; nothing to publish"
            echo "verify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "verify=true" >> "$GITHUB_OUTPUT"
          if curl -sf "https://thunderstore.io/api/experimental/package/koenhendriks/ValheimWebMap/$VERSION/" >/dev/null; then
            echo "$VERSION is already on Thunderstore"
            exit 0
          fi
          tcli publish --file "dist/thunderstore/koenhendriks-ValheimWebMap-$VERSION.zip"

      # Confirms the version is really downloadable: fetches the package from Thunderstore (with
      # retries, since a fresh upload takes a moment to propagate) and checks that it carries this
      # version and the DLL that was just built.
      - name: Verify Thunderstore download
        if: steps.publish.outputs.verify == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          url="https://thunderstore.io/package/download/koenhendriks/ValheimWebMap/$VERSION/"
          for attempt in $(seq 1 12); do
            if curl -sfL -o /tmp/thunderstore.zip "$url" && unzip -tq /tmp/thunderstore.zip >/dev/null 2>&1; then
              break
            fi
            echo "attempt $attempt: $url not downloadable yet"
            rm -f /tmp/thunderstore.zip
            sleep 30
          done
          [ -f /tmp/thunderstore.zip ] || { echo "::error::$url could not be downloaded"; exit 1; }
          echo "downloaded $(stat -c %s /tmp/thunderstore.zip) bytes from $url"

          got=$(unzip -p /tmp/thunderstore.zip manifest.json | python3 -c 'import sys, json; print(json.load(sys.stdin)["version_number"])')
          [ "$got" = "$VERSION" ] || { echo "::error::Thunderstore serves version $got, expected $VERSION"; exit 1; }

          expected=$(sha256sum dist/ValheimWebMap/plugins/ValheimWebMap/ValheimWebMap.dll | cut -d' ' -f1)
          actual=$(unzip -p /tmp/thunderstore.zip plugins/ValheimWebMap/ValheimWebMap.dll | sha256sum | cut -d' ' -f1)
          [ "$actual" = "$expected" ] || { echo "::error::DLL in the Thunderstore package differs from this build"; exit 1; }
          echo "Thunderstore package $VERSION verified: manifest version and DLL checksum match"
